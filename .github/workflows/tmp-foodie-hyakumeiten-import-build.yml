name: tmp-foodie-hyakumeiten-import-build

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install requests beautifulsoup4 lxml
      - name: Build official roster and final import files
        run: |
          python scripts/generate_hyakumeiten_2020.py
          python scripts/build_hyakumeiten_import.py
      - name: Upload final import files
        uses: actions/upload-artifact@v4
        with:
          name: foodie-hyakumeiten-2020-import
          path: |
            generated_hyakumeiten/manifest.json
            generated_hyakumeiten_import/
          retention-days: 1
      - name: Commit final import files
        run: |
          git add generated_hyakumeiten/ generated_hyakumeiten_import/
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Generate final 2020 Hyakumeiten import data"
          git push origin HEAD:${{ github.head_ref || github.ref_name }}
